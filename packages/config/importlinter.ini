[importlinter]
root_packages =
    lmpc_contracts
    lmpc_engine
    lmpc_db
    lmpc_api
    lmpc_vision
    lmpc_reports

[importlinter:contract:layers]
name = LMPC import direction
type = layers
layers =
    lmpc_api
    lmpc_vision
    lmpc_reports
    lmpc_engine
    lmpc_db
    lmpc_contracts
containers =
    lmpc_api
    lmpc_vision
    lmpc_reports
    lmpc_engine
    lmpc_db
    lmpc_contracts

[importlinter:contract:api-not-vision]
name = API must not import vision or reports
type = forbidden
source_modules =
    lmpc_api
forbidden_modules =
    lmpc_vision
    lmpc_reports

[importlinter:contract:workers-not-api]
name = Workers must not import the API
type = forbidden
source_modules =
    lmpc_vision
    lmpc_reports
forbidden_modules =
    lmpc_api
