[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmpc-db"
version = "0.1.0"
description = "SQLAlchemy models, session, tenant-filtered repositories."
requires-python = ">=3.12,<3.13"
dependencies = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/lmpc_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
