name: lmpc-inspect

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lmpc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmpc}
      POSTGRES_DB: ${POSTGRES_DB:-lmpc}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmpc"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lmpc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lmpc-minio-dev}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-lmpc} $${MINIO_ROOT_PASSWORD:-lmpc-minio-dev};
      mc mb -p local/lmpc-evidence || true;
      exit 0;
      "

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://lmpc:lmpc@postgres:5432/lmpc
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lmpc-evidence
      JWT_SECRET: ${JWT_SECRET:-change-me-in-deploy}
      FEATURE_LISTINGS: "false"
      FEATURE_DASHBOARD: "true"
      FEATURE_WATCHLIST: "false"
      FEATURE_PACKER_SANDBOX: "false"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  vision:
    build:
      context: ..
      dockerfile: infra/Dockerfile.vision
    environment:
      DEVICE: cpu
      VISION_BACKEND: canned
      DATABASE_URL: postgresql://lmpc:lmpc@postgres:5432/lmpc
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lmpc-evidence
    depends_on: [postgres, redis, minio]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

  reports:
    build:
      context: ..
      dockerfile: infra/Dockerfile.reports
    environment:
      DATABASE_URL: postgresql://lmpc:lmpc@postgres:5432/lmpc
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lmpc-evidence
    depends_on: [postgres, redis, minio]

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      API_UPSTREAM: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
